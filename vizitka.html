<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Алла Христова — визитка</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,'Segoe UI',sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100svh;background:#0a0a0a;color:#f6f4ff;display:grid;place-items:center;padding:24px;overflow-x:hidden}body:before{content:"";position:fixed;inset:-35%;background:radial-gradient(circle at 35% 40%,#713ce32a,transparent 35%),radial-gradient(circle at 70% 60%,#18bfe725,transparent 30%);pointer-events:none;animation:float 12s ease-in-out infinite alternate}.card{position:relative;width:min(100%,540px);padding:clamp(30px,7vw,62px);border:1px solid #ffffff25;border-radius:30px;background:linear-gradient(145deg,#1c1a24e8,#101015f2);box-shadow:0 24px 80px #0009,0 0 50px #7547e518;text-align:center;backdrop-filter:blur(12px)}.symbol{width:70px;height:70px;margin:0 auto 24px;display:grid;place-items:center;border-radius:22px;background:linear-gradient(135deg,#9b6cff,#3ecbe8);box-shadow:0 0 32px #8b65ed70}.eyebrow{font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:#b7a5d7}h1{font-size:clamp(42px,9vw,67px);line-height:1.07;letter-spacing:-.045em;margin:15px 0 22px;background:linear-gradient(110deg,#fff,#caaaff 48%,#69e3ff);color:transparent;background-clip:text;filter:drop-shadow(0 0 22px #8d62ff65)}.subtitle{font-size:clamp(17px,3.8vw,20px);line-height:1.55;color:#d0cadb;margin:0 auto 30px;max-width:360px}.button{border:0;border-radius:100px;padding:15px 30px;font-size:16px;font-weight:700;color:#101018;background:linear-gradient(100deg,#b99aff,#78e4f5);cursor:pointer;transition:transform .25s,box-shadow .25s;box-shadow:0 6px 25px #8f71e844}.button:hover,.button:focus-visible{transform:translateY(-4px);box-shadow:0 12px 35px #8f71e888}.button:focus-visible{outline:3px solid white;outline-offset:4px}.details{margin-top:24px;padding:20px;border:1px solid #ffffff25;border-radius:18px;color:#ddd5ec;line-height:1.65;background:#ffffff08}.details[hidden]{display:none}.footer{margin-top:34px;color:#918b9f;font-size:13px}.spark{width:28px;height:28px;vertical-align:middle;transition:transform .25s}.symbol:hover .spark{transform:rotate(15deg) scale(1.12)}@keyframes float{to{transform:translate(3%,3%)}}@media(prefers-reduced-motion:reduce){*,*:before{animation:none!important;transition:none!important}}
</style>
</head>
<body><main class="card"><div class="symbol" aria-hidden="true"><svg class="spark" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 2.5 7.5L22 12l-7.5 2.5L12 22l-2.5-7.5L2 12l7.5-2.5L12 2Z"/></svg></div><div class="eyebrow">Персональная визитка</div><h1>Алла<br>Христова</h1><p class="subtitle">Начинающий специалист по искусственному интеллекту (ИИ)</p><button class="button" id="about" aria-expanded="false" aria-controls="details">Обо мне ✨</button><section class="details" id="details" hidden>Я изучаю искусственный интеллект, осваиваю новые технологии и делаю первые шаги в мире ИИ.</section><div class="footer">Учусь • Развиваюсь • Открываю новое</div></main><script>const b=document.getElementById('about'),d=document.getElementById('details');b.addEventListener('click',()=>{const open=d.hidden;d.hidden=!open;b.setAttribute('aria-expanded',String(open));b.textContent=open?'Скрыть описание ↑':'Обо мне ✨'});</script></body></html>
